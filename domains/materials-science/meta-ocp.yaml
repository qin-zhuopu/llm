name: Meta Open Catalyst Project
name_en: Open Catalyst Project (OCP)
company: Meta
domain: materials-science
status: released
description: Meta 与 CMU 合作的开源 AI 研究项目，致力于通过人工智能模拟和发现新型催化剂，以解决可再生能源存储中的气候问题。该项目提供了包含
  1.3 百万个分子弛豫和超过 2.6 亿次 DFT 计算结果的大规模数据集（OC20/OC22），旨在降低量子力学模拟的高昂计算成本，加速低成本催化剂的研发，支持氢燃料生产和氨合成等清洁能源应用。
capabilities:
- 催化剂模拟与发现
- 量子力学近似计算
- DFT 计算结果预测
- 分子结构弛豫模拟
- 可再生能源存储方案优化
references:
- title: Open Catalyst Project Official Website
  url: https://opencatalystproject.org/
datasets:
- name: Open Catalyst 2020 (OC20)
  description: Large-scale dataset for training ML models on catalyst discovery
- name: Open Catalyst 2022 (OC22)
  description: Extended dataset with additional calculations
