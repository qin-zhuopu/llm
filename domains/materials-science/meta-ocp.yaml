name: Meta Open Catalyst Project (OCP)
name_en: Meta Open Catalyst Project
company: Meta
domain: materials-science
status: research
website: https://opencatalystproject.org/
description: Meta FAIR与卡内基梅隆大学化学工程系合作的开放催化剂项目，旨在利用AI发现用于可再生能源存储的新型催化剂以应对气候变化。项目发布了包含130万分子弛豫和超过2.6亿密度泛函理论（DFT）计算结果的开放数据集（OC20和OC22），通过机器学习高效近似量子力学模拟，大幅加速催化剂筛选过程。代码和基线模型已在GitHub开源。
parameters: 未公开
architecture: graph neural network
training:
  stages:
  - name: pre-training
    description: 在大规模密度泛函理论（DFT）计算数据上训练图神经网络模型，学习原子间相互作用和催化反应能量预测。OC20数据集包含130万分子弛豫，来自超过2.6亿DFT计算。
    data_tokens: 260M+ DFT calculations
tech_stack:
  framework: PyTorch
  techniques:
  - Graph Neural Networks (GNN)
  - Density Functional Theory (DFT) approximation
  - Molecular relaxation prediction
  - Energy and force prediction
  - Open-source baseline models
datasets:
- name: Open Catalyst 2020 (OC20)
  description: 大规模催化剂发现训练数据集，包含分子弛豫计算和DFT结果
  size: 1.3M molecular relaxations, 260M+ DFT calculations
  type: pre-training
- name: Open Catalyst 2022 (OC22)
  description: OC20的扩展数据集，包含额外的DFT计算和新的催化反应体系
  type: pre-training
benchmarks:
- name: Catalyst Discovery Acceleration
  score: 数千倍加速
  metric: speedup
  comparison: 'vs 传统DFT模拟: ML近似方法比量子力学模拟快数千倍'
  source: self-reported
- name: Energy Prediction Accuracy
  score: 接近DFT精度
  metric: mae
  split: test
  comparison: 'vs DFT ground truth: 在保持接近精度的同时实现数千倍加速'
  source: self-reported
capabilities:
- 基于ML高效近似量子力学催化剂模拟计算
- CO2还原催化剂发现与优化
- 氢燃料生产催化剂筛选
- 燃料电池OER/ORR反应催化剂设计
- 氨合成（农业肥料）催化剂优化
- 开放数据集和排行榜支持社区研究
access:
- open-weights
tags:
- catalyst-discovery
- clean-energy
- graph-neural-network
- dft
- open-source
- climate
- renewable-energy
references:
- title: Open Catalyst Project Official Website
  url: https://opencatalystproject.org/
- title: Open Catalyst Project GitHub
  url: https://github.com/Open-Catalyst-Project
