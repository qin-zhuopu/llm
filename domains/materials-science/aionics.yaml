name: Aionics
company: Aionics
domain: materials-science
status: released
release_date: '2020'
website: https://www.aionics.io/
description: Aionics 是一家利用 AI 和物理仿真加速清洁能源材料设计的公司，平台可筛选数十亿种配方候选并结合第一性原理和分子动力学仿真验证预测结果，
  支持生成式 AI 设计全新分子结构。面向电动汽车电池、航空电池、长时储能、绿色制造和消费电子等领域， 将材料研发周期从数年缩短至数周，已服务多家 EV 和电网储能客户。
parameters: 未公开
architecture: graph neural network + physics simulation ensemble
capabilities:
- AI 驱动筛选数十亿材料配方候选以匹配目标性能
- 第一性原理和分子动力学物理仿真验证 AI 预测
- 生成式 AI 设计新型分子结构
- 供应链对接确保配方可量产落地
- 面向电池电解液/正极/负极材料的定制化配方优化
- 跨行业覆盖 EV/航空/电网储能/消费电子
training:
  stages:
  - name: pre-training
    description: 基于大规模材料科学文献、专利数据库和实验数据训练分子属性预测基础模型
  - name: fine-tuning
    description: 针对特定客户需求（如电解液配方、正极材料组成）进行领域微调，结合客户私有实验数据
  - name: other
    description: 物理仿真验证循环 - 将 AI 预测结果通过分子动力学/DFT仿真进行验证，反馈优化模型
tech_stack:
  framework: PyTorch
  techniques:
  - generative AI for molecular design
  - first-principles simulation (DFT)
  - molecular dynamics
  - high-throughput virtual screening
  - graph neural networks
  - Bayesian optimization
datasets:
- name: 材料科学文献语料
  description: 电池材料、电解液配方相关的学术论文和专利数据
  type: pre-training
- name: 实验验证数据
  description: 客户和合作伙伴提供的实验配方及性能测试数据
  type: other
benchmarks:
- name: 配方筛选效率
  score: 10亿+候选/次
  metric: throughput
  comparison: vs 传统实验方法每次仅测试数十种配方
  source: self-reported
- name: 研发周期缩减
  score: 80%
  metric: time-reduction
  comparison: 将材料研发从数年缩短至数周
  source: self-reported
tags:
- battery-materials
- ev-battery
- energy-storage
- formulation-design
- green-manufacturing
- molecular-design
access:
- saas
api:
  available: true
  protocol: rest
  pricing: 联系销售（企业定制方案）
references:
- title: Aionics 官方网站
  url: https://www.aionics.io/
- title: Aionics - Accelerating the Clean Energy Revolution with AI
  url: https://www.aionics.io/
