description: 中国电信自主研发的行业大模型平台，定位为电信行业智能化转型的核心引擎。依托中国电信遍布全国的云网基础设施和算力资源，采用模块化架构设计，支持基础大模型与行业微调模型的灵活组合。覆盖网络运营、客户服务、安全保障、云计算和数字政府等多个领域，旨在推动企业从传统流量经营向Token经营的战略转型。
capabilities:
- 网络智能运营与自治网络管理
- 全渠道客户服务自动化与意图识别
- 网络安全监控与异常流量防护
- 云资源智能调度与成本优化
- 数字政务服务与城市治理支持
