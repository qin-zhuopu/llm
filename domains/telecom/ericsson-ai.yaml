description: 爱立信（Ericsson）推出的面向电信网络的AI解决方案体系，核心战略为'AI RAN'，结合意图驱动管理与AI原生能力，旨在为运营商提供5G及6G时代的智能网络方案。该体系涵盖RAN优化、预测性维护、网络切片自动化及能效优化等关键功能。
capabilities:
- 基于图神经网络GNN的RAN网络设计与优化
- 利用强化学习实现意图驱动的RAN自主优化
- 网络设备预测性维护与故障智能识别
- 5G网络切片资源动态分配与SLA实时保障
- AI驱动的基站休眠策略与能耗管理优化
- 面向自治网络的闭环自动化与自愈能力
