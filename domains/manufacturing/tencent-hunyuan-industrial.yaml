description: 腾讯混元(工业版)是腾讯基于自研万亿参数规模混元大模型，面向工业制造领域深度定制的解决方案。该模型具备强大的中文理解、逻辑推理及任务执行能力，针对制造业特殊需求进行了专业化适配，支持边云协同部署，并满足工业数据安全与隐私保护要求，日均调用量超十亿次。
