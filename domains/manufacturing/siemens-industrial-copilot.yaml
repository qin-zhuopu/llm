description: Eigen Engineering Agent 是西门子推出的专为工业自动化工程设计的专用生成式 AI 解决方案。该模型能够自主完成从计划、编码、配置到验证的端到端工程任务，目前服务于超过 60 万名 TIA Portal 用户。它不仅提供建议，还能实际执行操作，旨在将 AI 深度集成于物理世界的工业操作系统中，显著提升工程效率。
capabilities:
- 自主规划工程任务
- 自动化代码生成
- 设备配置管理
- 自动化逻辑验证
- 端到端工作流执行
