name: Siemens Industrial Copilot / Eigen Engineering Agent
name_en: Siemens Industrial Copilot / Eigen Engineering Agent
company: 西门子 (Siemens)
domain: manufacturing
status: released
release_date: "2024"
website: https://www.siemens.com/global/en/products/automation/topic-areas/industrial-copilot.html
description: 西门子工业 Copilot 及 Eigen Engineering Agent 是面向工业自动化工程的专用 AI 系统。Eigen Engineering Agent 为超过60万 TIA Portal 用户提供服务，能够自主规划、编写代码、配置和验证自动化工程任务，将 AI 从建议生成提升至端到端任务执行。西门子与 NVIDIA 合作构建工业 AI 操作系统，覆盖产品设计、工程、生产到运维的全价值链。
parameters: 未公开
architecture: decoder-only transformer
base_model: GPT-4
training:
  stages:
  - name: fine-tuning
    description: 基于工业自动化工程领域数据（PLC编程、SCADA配置、工业协议等）进行微调，使模型具备TIA Portal工程任务理解和执行能力
  - name: rlhf
    description: 由资深自动化工程师进行反馈训练，确保生成的工程代码和配置符合工业标准和安全规范
tech_stack:
  framework: Microsoft Azure OpenAI + Siemens Xcelerator
  inference: Azure Cloud + Edge deployment
  techniques:
  - Agentic AI (autonomous task planning and execution)
  - Industrial knowledge grounding
  - Code generation for PLC/SCADA
  - Digital Twin integration
  - NVIDIA Omniverse partnership
  - Physical AI for robotics
datasets:
- name: TIA Portal Engineering Knowledge Base
  description: 西门子TIA Portal工业自动化工程知识库，包含PLC编程规范、配置模板和最佳实践
  type: sft
- name: Industrial Automation Standards
  description: IEC 61131-3等工业自动化标准和安全规范数据
  type: sft
benchmarks:
- name: TIA Portal User Base
  score: "600000+"
  metric: user_reach
  comparison: "面向超过60万TIA Portal用户提供AI工程辅助"
- name: Engineering Task Automation
  score: "端到端执行"
  metric: capability_level
  comparison: "vs 传统Copilot建议模式: 从生成建议升级为自主规划-编码-配置-验证全流程执行"
capabilities:
- 自主规划、编写和验证PLC自动化程序代码
- TIA Portal工程任务端到端自动化执行
- 工业数字孪生构建与仿真优化
- 自然语言驱动的工业自动化配置
- 与NVIDIA合作的物理AI（机器人部署）
- AI驱动的电力网格规划（Gridscale X）
- 跨产品设计/工程/生产/运维全价值链AI赋能
