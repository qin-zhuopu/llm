name: Bright Machines Brain (Physical AI)
name_en: Bright Machines Brain (Physical AI)
company: Bright Machines
domain: manufacturing
status: released
release_date: '2024'
website: https://www.brightmachines.com
description: Bright Machines 是下一代制造商，用机器人和物理 AI（physical AI）改变产品设计与制造方式，专注软件定义的 AI 基础设施制造——用 AI 和计算机视觉驱动的模块化机器人装配单元（Microfactories）构建 AI 服务器、AI 机架和 AI 存储系统。其 Bright Machines Brain 软件/AI 栈用计算机视觉和 ML 实现自适应装配、在线检测和闭环控制，无需传统 PLC 手工编程即可重编程机器人单元。与 Microsoft（云/车间流式）和 NVIDIA（Omniverse 数字孪生）合作，累计融资超 4.3 亿美元。
parameters: 未公开
architecture: Physical AI (computer vision + ML) driving software-defined robotic assembly cells
training:
  stages:
  - name: pre-training
    description: 在机器人操作与装配图像数据上预训练计算机视觉与操作模型，学习部件识别、抓取和装配动作
  - name: fine-tuning
    description: 针对具体产品（AI 服务器/机架/存储系统）装配任务微调，结合 NVIDIA Omniverse 数字孪生仿真做虚拟调试与自适应装配
tech_stack:
  framework: PyTorch
  inference: Edge (机器人单元) + NVIDIA Omniverse 仿真
  techniques:
  - Physical AI (computer vision + robotic manipulation)
  - Software-defined automation (Bright Machines Brain)
  - Adaptive assembly & closed-loop control
  - Digital twin (NVIDIA Omniverse)
  - Cloud streaming to factory floor (Microsoft)
datasets:
- name: Robotic Assembly Data
  description: 机器人装配单元的图像与操作数据，用于自适应装配、抓取和在线检测
  type: pre-training
