description: C3 AI Reliability 是 C3.ai 面向工业资产运营方的 AI 预测性维护应用，运行于 C3 Agentic AI Platform。它统一传感器数据、维修记录和备件库存到灵活数据模型，用先进时序基础模型和成熟 ML 模型对即将发生的设备风险做早期准确预测，并自动生成失效模式识别与建议加速根因诊断，另配 AI 驱动的搜索与聊天界面将资产历史与机构知识带入实时运营。覆盖离散/连续/批次/半批次生产过程。Verdantix 在 2025 工业 AI 分析软件报告中评其为第一领导者，自报停机减少 50%、OEE 提升 5%。
parameters: 未公开
architecture: Time-series foundation models + classical ML on C3 Agentic AI Platform (model-driven architecture)
training:
  stages:
  - name: pre-training
    description: 在大规模工业时序数据上预训练时序基础模型，学习设备正常运行模式与失效前兆
  - name: fine-tuning
    description: 针对具体资产和生产过程（离散/连续/批次/半批次）微调，结合失效模式识别与生成式 AI 搜索/聊天层
