name: Autodesk AI
name_en: Autodesk AI
company: Autodesk
domain: construction-realestate
status: released
release_date: "2024"
website: https://www.autodesk.com
description: Autodesk推出的嵌入式AI和机器学习能力套件，覆盖AutoCAD、Revit、Fusion等设计、工程和建筑软件产品。核心功能包括生成式设计（算法优化空间规划和结构设计）、Autodesk Assistant自然语言建模助手（Revit 2027技术预览）、AutoCAD机器学习自动化和BIM智能化，服务于全球数百万建筑、工程、施工和制造专业人员。
parameters: 未公开
architecture: multi-model ensemble
training:
  stages:
  - name: fine-tuning
    description: 基于AEC和制造业领域的设计数据、BIM模型和工程文档进行模型训练和优化，支撑生成式设计的参数化搜索和AI助手的自然语言交互能力。
tech_stack:
  framework: Autodesk Platform (Cloud-connected)
  techniques:
  - Generative Design (algorithmic optimization)
  - Generative AI (neural network-based creation)
  - Machine Learning for drafting automation
  - Natural Language Processing (Autodesk Assistant)
  - Topology optimization
  - BIM intelligence and clash detection
  - Predictive analytics for construction
datasets:
- name: BIM and Design Data
  description: 来自Revit、AutoCAD、Fusion等产品积累的海量建筑信息模型、工程设计文件和施工文档数据
  type: pre-training
benchmarks:
- name: Design Alternative Generation Speed
  score: "数百种方案/小时"
  metric: throughput
  comparison: "vs 人工设计: 从数周缩短到数小时生成数百种优化方案"
- name: Topology Optimization Efficiency
  score: "显著减重"
  metric: weight_reduction
  comparison: "vs 传统设计: 在满足强度要求的同时实现显著减重"
- name: Construction Risk Prediction
  score: "高准确率"
  metric: accuracy
  comparison: "vs 传统项目管理: 提供数据驱动的进度和风险预测"
capabilities:
- 生成式设计快速生成满足约束条件的数百种空间规划和结构方案
- Autodesk Assistant自然语言交互，直接在建模环境中提问和触发操作
- AutoCAD机器学习辅助制图、工程设计和工作流自动化
- BIM智能碰撞检测、工程量提取和设计协调
- 拓扑优化实现轻量化高强度组件设计
- 施工项目预测分析，包括进度预测和资源优化
access:
- saas
tags:
- generative-design
- bim
- architecture
- construction
- cad
- natural-language-interface
- topology-optimization
references:
- title: Autodesk AI Official Website
  url: https://www.autodesk.com
- title: Autodesk Revit 2027 AI Features
  url: https://www.autodesk.com/products/revit
