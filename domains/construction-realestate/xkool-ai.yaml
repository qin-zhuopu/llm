name: 小库科技 XKool AI
name_en: XKool AI
company: 小库科技
domain: construction-realestate
status: released
release_date: '2023'
website: https://www.xkool.ai
description: 小库科技推出的面向建筑与房地产行业的一站式 AI 平台（LookX AI Cloud），融合 AIGC 内容创作、云端 BIM 协同和智能管理功能，
  采用"数据+模型+规则"三位一体的 AI-driven BIM on Cloud (ABC) 模式实现建筑数字化新范式。 平台累计完成 10M+ 生成任务，拥有
  200K+ 注册用户和 1000+ 企业客户，持有 100+ 专利， 覆盖设计（XKool Design Cloud）、施工（装配式建筑）、管理（房地产数字化）和学术研究（ARP）全链路。
parameters: 未公开
architecture: diffusion model + 3D spatial reasoning
training:
  stages:
  - name: pre-training
    description: 基于大规模建筑设计数据（建筑图纸、BIM模型、设计方案）预训练生成模型，学习建筑风格和空间关系
  - name: fine-tuning
    description: 使用建筑专业标注数据微调，覆盖规划设计、建筑渲染、户型生成等具体任务
  - name: sft
    description: 基于建筑师反馈的指令微调，确保生成内容符合建筑规范和审美标准
datasets:
- name: 建筑设计方案数据集
  description: 海量建筑设计图纸、渲染图、BIM模型和规划方案
  type: pre-training
- name: 建筑规范知识库
  description: 中国建筑设计规范、建设标准和行业导则
  type: sft
tech_stack:
  framework: PyTorch
  inference: 云端GPU集群推理
  techniques:
  - diffusion model for image generation
  - text-to-image architecture generation
  - BIM data understanding
  - 3D spatial reasoning
  - style transfer and adaptation
  - SketchUp/Rhino plugin integration
benchmarks:
- name: 累计生成任务量
  score: 10M+
  metric: total generation tasks
  comparison: 建筑 AIGC 领域领先，vs 同类平台百万级
  source: self-reported
- name: 注册用户数
  score: 200K+
  metric: registered users
  source: self-reported
- name: 企业客户数
  score: 1000+
  metric: enterprise clients
  source: self-reported
- name: 专利数量
  score: 100+
  metric: patents
  source: self-reported
capabilities:
- 基于文本或图像的 AI 建筑渲染与内容生成（LookX AI Cloud）
- 实时文本/草图到建筑渲染图转换（RealTime功能）
- 自定义 AI 模型训练与风格迁移
- 云端 AI 驱动的建筑信息模型(BIM)协同设计
- 装配式建筑与预制构件智能生成方案
- 房地产全流程数字化管理解决方案
- 学术研究平台支持（ARP Researcher）
- SketchUp 和 Rhino 多平台插件集成
tags:
- aigc
- 建筑设计
- bim
- 云端协作
- 房地产数字化
- diffusion-model
- text-to-image
access:
- saas
api:
  available: true
  protocol: rest
  pricing: 免费基础版 + 付费专业版
  auth_method: 账号注册
references:
- title: XKool 官方网站
  url: https://www.xkool.ai
