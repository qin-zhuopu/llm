name: Harvey Review Table Model
company: Harvey & Applied Compute
domain: legal
status: released
description: 由 Harvey 与 Applied Compute 合作训练的专业法律大模型，专为 Harvey Review Table 产品的大规模文档分析工作负载优化。该模型基于开源模型（如
  GLM 或 Qwen 架构）进行后训练，通过合成法律数据（包括合同、诉讼文档等）和强化学习对齐，在答案准确性和引用质量上超越了通用前沿模型。在评测中，该模型相比基线
  GLM 5.2 在引用质量上提升了 22.4%，答案质量达到 0.903 分（优于 GPT-5.6-Sol 的 0.857），同时相比 Claude Sonnet
  5 降低了 54.8% 的平均单元成本。
capabilities:
- 大规模法律文档审查与分析
- 复杂表格信息提取与结构化输出
- 高精度法律引证生成与来源定位
- 法律问题语义检索与推理
references:
- title: Training Frontier Review Table Agents with Harvey
  url: https://appliedcompute.com/case-studies/harvey-review-table
- title: Harvey Official Website
  url: https://www.harvey.ai
benchmarks:
- name: Review Table Answer Score
  score: 0.903
  metric: answer_score
  comparison: 'vs GPT-5.6-Sol: 0.903 vs 0.857'
- name: Review Table Citation Score
  score: 0.841
  metric: citation_precision
  comparison: 'vs GLM 5.2: +22.4% improvement'
- name: Review Table Citation Recall
  score: 0.9193
  metric: citation_recall
architecture: Single-turn Transformer with Semantic Retrieval / Agentic
base_model: Open Source (GLM 5.2 / Qwen3.6-35B-A3B)
access:
- api
- private-deployment
tags:
- legal-ai
- document-analysis
- information-extraction
- retrieval-augmented
- agentic
- cost-optimization
