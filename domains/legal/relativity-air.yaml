name: Relativity aiR
name_en: Relativity aiR
company: Relativity
domain: legal
status: released
website: https://www.relativity.com/aiR
description: Relativity公司开发的法律AI软件套件，集成于RelativityOne平台，通过生成式AI加速诉讼和调查流程。产品矩阵包含aiR
  for Review（文档审查）、aiR for Privilege（特权保护）、aiR for Case Strategy（案件策略）、aiR for Data
  Breach Response（数据泄露响应）和aiR Assist（AI助手）五大核心产品。采用Azure OpenAI集成架构，客户数据永不被保留，已获ISO
  27001、SOC 2和FedRAMP认证。客户实证显示节省20%-85%成本。
parameters: 未公开
architecture: decoder-only transformer (Azure OpenAI)
base_model: GPT-4 (Azure OpenAI)
training:
  stages:
  - name: fine-tuning
    description: 基于Azure OpenAI服务进行法律领域定制化调优，针对文档审查、特权识别、案件策略分析等法律任务优化模型输出。采用代理式AI系统设计，人类始终参与输入提示标准、验证输出和评估推理过程。
tech_stack:
  framework: Azure OpenAI Service
  inference: RelativityOne Platform
  techniques:
  - Azure OpenAI integration
  - Agentic AI system design
  - Document-level citation and reasoning
  - Just-in-time access model
  - Privileged access management
  - Human-in-the-loop workflow
  - Recall/precision/omission metrics
datasets:
- name: Legal Document Corpus
  description: 用于训练和评估的法律文档数据，包括诉讼文件、合同、电子邮件和特权通信等
  type: sft
- name: Case Testing Data
  description: 使用真实案件数据进行部署前测试，支持召回率、精确率和遗漏率度量
  type: evaluation
benchmarks:
- name: Microsoft Document Review Cost Savings
  score: 20%-40%
  metric: cost_reduction
  comparison: 'vs 传统人工审查: Microsoft预计文档审查平均节省20%-40%成本'
  source: self-reported
- name: Teneo Review Efficiency
  score: 70%
  metric: cost_reduction
  comparison: 'vs 传统流程: 18天内审查100万份文档，实现70%成本节约'
  source: self-reported
- name: KordaMentha Cost Reduction
  score: 85%
  metric: cost_reduction
  comparison: 'vs 传统流程: 降低85%成本，同时节省25天审查时间'
  source: self-reported
capabilities:
- 大规模文档审查和相关性自动判定（aiR for Review）
- 律师-客户特权通信自动识别与特权日志创建（aiR for Privilege）
- 案件事实提取、时间线建立和策略制定辅助（aiR for Case Strategy）
- 数据泄露事件快速响应和受影响个人信息识别（aiR for Data Breach Response）
- 自然语言对话式法律数据探索（aiR Assist）
- 文档级引用和推理，确保可辩护性
access:
- saas
tags:
- e-discovery
- legal-review
- privilege-detection
- azure-openai
- compliance
- agentic-ai
- document-review
references:
- title: Relativity aiR Official Website
  url: https://www.relativity.com/aiR
- title: Relativity Security and Compliance
  url: https://www.relativity.com/security
