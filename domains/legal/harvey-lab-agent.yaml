name: AC GLM-5.1 (Legal Agent)
name_en: AC GLM-5.1 Legal Agent
company: Applied Compute & Harvey
domain: legal
status: released
release_date: 2026-06
website: https://appliedcompute.com/case-studies/harvey
description: 基于 GLM-5.1 通过全参数异步强化学习后训练的前沿法律智能体模型。在 Harvey 开源法律智能体基准 (LAB) 上，Rubric
  Pass Rate 从基线 0.853 提升至 0.913，All-Pass Rate 从 0.059 提升至 0.126，在 Rubric Pass Rate
  上超越 GPT-5.5 xhigh 和 Opus 4.8 Max，成为业内首个突破该阈值的训练模型。LAB 覆盖 24 个法律实践领域、1250+ 任务和 75000+
  二元标准。模型通过改进工具调用、增强归因准确性和提高精确度实现性能突破。
parameters: 未公开
architecture: decoder-only transformer
base_model: GLM-5.1
training:
  stages:
  - name: post-training
    description: 全参数完全异步强化学习 (full-parameter fully-asynchronous RL)，使用 AC2 平台训练。训练信号来自
      GPT-5 Mini 作为评分模型，采用 4 criteria-per-call 批量评分策略。训练过程中模型学会更精准的工具调用、更高的文档归因准确性和更具体的数值引用。
  context_length: 131K
tech_stack:
  framework: AC2 (Applied Compute Agent Cloud)
  inference: Compaction harness with context summarization
  techniques:
  - Full-parameter RL
  - Fully-asynchronous RL
  - LLM-as-Judge grading (GPT-5 Mini)
  - Criteria batching (4-per-call)
  - Context compaction (auto-summarization at 131K tokens)
  - Harness hill-climbing
  - Broken tool call repair
datasets:
- name: Harvey Legal Agent Benchmark (LAB)
  description: 开源法律智能体基准，覆盖 24 个法律实践领域，包含源文档、任务指令和任务特定评分标准
  size: 1250+ tasks, 75000+ binary criteria
  type: rlhf
- name: LAB held-out test split
  description: 从 LAB 完整分布中抽取的保留测试集，用于评估模型性能，包含约 180 个任务和约 10000 个评分标准
  size: 180 tasks, ~10000 criteria
  type: evaluation
benchmarks:
- name: Harvey LAB - Rubric Pass Rate
  score: 0.913
  metric: rubric_pass_rate
  split: test
  comparison: 'vs GLM-5.1 Base: 0.853; vs GPT-5.5 xhigh: lower; vs Opus 4.8 Max: lower
    (model exceeds both)'
  source: self-reported
- name: Harvey LAB - All Pass Eval Score
  score: 0.126
  metric: all_pass_rate
  split: test
  comparison: 'vs GLM-5.1 Base: 0.059; approaching Opus 4.8 Max'
  source: self-reported
capabilities:
- 处理 24 个法律实践领域的复杂文档审查与推理任务
- 精准工具调用 (read/grep/bash)，避免冗余信息加载
- 大规模源文档中精确信息提取与归因，杜绝虚构引用
- 在 20 万+ token 源文档环境中保持持续注意力和一致性
- 严格遵守法律格式要求生成完整交付物 (artifact)
- 数值精确引用，避免四舍五入等不精确表述
access:
- private-deployment
tags:
- legal-agent
- reinforcement-learning
- full-parameter-rl
- tool-use
- harvey-lab
- agentic
- compaction
references:
- title: Training a State-of-the-Art Legal Agent with Harvey
  url: https://appliedcompute.com/case-studies/harvey
- title: Harvey's Legal Agent Benchmark (LAB)
  url: https://www.harvey.ai/blog/introducing-harveys-legal-agent-benchmark
- title: Harvey Official Website
  url: https://harvey.ai
