name: AC GLM-5.1 (Legal Agent)
company: Applied Compute & Harvey
domain: legal
status: released
description: 基于 GLM-5.1 基座通过全参数强化学习后训练的前沿法律智能体。该模型在 Harvey 的法律智能体基准 (LAB) 中表现出色，Rubric
  通过率从 0.853 提升至 0.913，性能超越了 GPT-5.5 xhigh 和 Opus 4.8 Max。模型在工具使用、归因依据以及精确性方面经过深度优化，具备处理超过
  20 万 Token 上下文的能力。
capabilities:
- 处理复杂的法律文档审查与分析任务
- 精准调用工具并进行多步骤推理
- 严格遵守法律格式与条款要求生成文书
- 在大量源文档中进行精确信息提取与归因
references:
- title: Training a State-of-the-Art Legal Agent with Harvey
  url: https://appliedcompute.com/case-studies/harvey
- title: Harvey's Legal Agent Benchmark (LAB)
  url: https://www.harvey.ai/blog/introducing-harveys-legal-agent-benchmark
benchmarks:
- name: Harvey Legal Agent Benchmark (LAB) - Rubric Pass Rate
  score: 0.913
  metric: pass_rate
  comparison: vs GPT-5.1 Base (0.853), GPT-5.5 xhigh, Opus 4.8 Max
- name: Harvey Legal Agent Benchmark (LAB) - All Pass Eval
  score: 0.126
  metric: pass_rate
  comparison: vs GPT-5.1 Base (0.059), approaching Opus 4.8 Max
tags:
- legal-agent
- reinforcement-learning
- tool-use
- harvey-benchmark
base_model: GLM-5.1
website: https://appliedcompute.com
