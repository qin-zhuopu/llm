name: Raptor Maps
name_en: Raptor Maps
company: Raptor Maps
domain: energy
status: released
website: https://www.raptormaps.com/
description: Raptor Maps是用AI、计算机视觉和机器人技术为太阳能（光伏）资产运维提供数字底座的公司，由两位MIT工程师创立，率先将光伏站点无人机航空热成像与基于地图的交互式数字孪生结合。其Raptor Solar平台分析数百万张无人机图像，检测组件热斑、组串故障、腐蚀、植被侵占和平衡系统部件缺陷，并通过数字孪生（Digital Twin）编排人机与机器人运维。Raptor Solar Sentry提供永久驻场、远程操作的自主无人机，可定时/告警触发/按需起飞，在火灾、风暴、SCADA告警时快速响应。全球团队支持六大洲光伏运营。
parameters: 未公开
architecture: computer vision models
training:
  stages:
  - name: pre-training
    description: 基于数百万张无人机航空热成像与可见光图像训练计算机视觉模型，识别光伏组件热斑、组串故障、腐蚀、植被侵占和平衡系统部件缺陷等异常。
  - name: fine-tuning
    description: 针对不同组件OEM、设备类型和站点条件微调异常检测与分类模型，并将结果映射到基于地图的数字孪生。
tech_stack:
  framework: Raptor Solar platform
  techniques:
  - Aerial thermography analysis
  - Computer vision anomaly detection
  - Map-based digital twin reconstruction
  - Autonomous drone (Sentry) mission orchestration
  - Time-series inspection analytics
  - Offline-ready mobile field app
datasets:
- name: Solar Inspection Imagery
  description: 无人机采集的数百万张光伏站点航空热成像与可见光图像，用于异常检测模型训练
  size: millions of images
  type: pre-training
- name: Digital Twin Asset Data
  description: 从多来源采集、聚合、归一化的光伏资产数据，构成基于地图的数字孪生记录系统
  type: pre-training
benchmarks:
- name: Global Coverage
  score: 6 continents
  metric: coverage
  comparison: 全球工程与技术团队支持六大洲的光伏运营
  source: self-reported
- name: Anomaly Detection Leadership
  score: 行业领先
  metric: detection
  comparison: 'vs 人工巡检: 处于组件与设备异常检测、机器人部署和资产管理最佳实践前沿'
  source: self-reported
capabilities:
- 分析数百万张无人机图像检测光伏组件热斑与组串故障
- 基于地图的数字孪生重建光伏电站资产
- Raptor Solar Sentry自主无人机定时/告警触发/按需巡检
- 火灾/风暴/SCADA告警事件的快速远程响应
- 支持离线的移动端App供现场技术人员使用
- 一致的机器人数据采集提供检测分析时间序列
