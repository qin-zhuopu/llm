name: DoorDash Menu Error Correction Model
company: DoorDash
domain: retail-ecommerce
status: released
description: 专为DoorDash商家入驻流程设计的菜单错误修正大模型。该模型利用强化学习（RL）技术，基于自动评分系统对菜单生成的结构化输出进行优化，能够处理包括照片、PDF和文本在内的多种菜单格式。模型成功将低质量菜单的占比降低了约30%，显著提升了菜单准确性和订单履约效率。
capabilities:
- 自动解析非结构化菜单数据（图片、PDF、文本）
- 生成符合DoorDash标准的结构化菜单列表
- 识别并修正复杂的菜单层级和描述错误
- 在高延迟和成本约束下保持高推理性能
references:
- title: Automating Merchant Onboarding at DoorDash
  url: https://appliedcompute.com/case-studies/doordash
- title: DoorDash Corporate Site
  url: https://about.doordash.com/
tags:
- menu-processing
- reinforcement-learning
- document-parsing
- quality-assurance
- error-correction
access:
- internal-only
