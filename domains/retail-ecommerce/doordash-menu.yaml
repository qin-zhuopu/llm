name: DoorDash Menu Error Correction Model
company: DoorDash
domain: retail-ecommerce
status: released
description: DoorDash 针对商家入驻流程开发的菜单纠错模型。该模型通过强化学习训练，利用自动评分系统模拟人类专家的验证标准，将菜单生成的低质量菜单份额降低了约
  30%。模型专注于将图片、PDF 和文本菜单转换为结构化数据，并处理复杂的长尾菜单格式，显著提高了平台菜单的准确性和一致性。
capabilities:
- 自动从非结构化源（图片、PDF）生成结构化菜单
- 利用强化学习优化纠错逻辑并减少错误率
- 解析和处理复杂的长尾菜单格式与层级
- 符合 DoorDash 高质量标准的生产级推理
references:
- title: Automating Merchant Onboarding at DoorDash
  url: https://appliedcompute.com/case-studies/doordash
- title: DoorDash Official Website
  url: https://about.doordash.com/
tags:
- menu-generation
- reinforcement-learning
- ocr
- data-structuring
- merchant-onboarding
