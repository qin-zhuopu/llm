name: Intercom Fin
name_en: Intercom Fin
company: Intercom
domain: customer-service
status: released
website: https://www.intercom.com/fin
description: "Intercom推出的企业客服Agent，定位最高性能的Customer Agent，跨越整个客户旅程覆盖服务到销售。运行在自研专有模型Apex 1.0和Apex Flash上，这些模型在数十亿次客户体验交互上定制训练，号称是客服领域最高性能、最快、最便宜的模型。相较Sonnet 4.6解决率高2.8%、首token时延快0.6秒、幻觉减少65%。跨12000+客户平均解决率76%（不少超85%），每周200万次解决且平均解决率每月提升1%，G2满意度90%。"
parameters: 未公开
architecture: "专有客服大模型 Apex 1.0 / Apex Flash（低延迟语音用 Apex Flash）"
