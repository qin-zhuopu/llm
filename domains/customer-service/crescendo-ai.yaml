domain: customer-service
status: released
website: https://www.crescendo.ai
description: "AI-native客户体验(CX)平台，服务150+品牌，主打全栈CX(一个平台、一套数据模型、一支团队)。三大支柱为applied expertise(派团队校准并对结果负责)、self-improving AI(AI复盘自身对话发现缺口并自我更新)、4周上线的快速价值。产品含Concierge、Agent Assist、Applied Insights、Quality(100%对话打分)与Workforce。两年内达到1亿美元ARR并进军欧洲，联合创始人Andy Lee(前Alorica CEO)任CEO，与BPO巨头Alorica战略合作。合规含SOC 2 Type II/HIPAA/ISO 27001/GDPR。"
parameters: 未公开
