description: "面向电商的对话式AI客服平台，One AI Agent覆盖售前到售后。其AI在10亿+对话上预训练，理解电商、Shopify数据和客户意图，可自动化60%支持、按品牌语气/政策/SOP应用护栏。全渠道收件箱(邮件/聊天/SMS/WhatsApp/Instagram/Facebook)，支持在对话内取消/折扣/追加销售等动作，原生Shopify集成+300+集成。报告19.2x销售ROI、2个月内56%自动化率、通过对话驱动5亿美元+收入，服务17000+电商品牌。基于与OpenAI的直接合作获得更深模型访问，Shopify参与投资。"
