  customers: 美国多州 city/county（如 Newport RI、Tooele County UT、Polk County NC）
  investors:
  - General Catalyst
capabilities:
- 居民跨渠道自助（语音/短信/网页）：回答问题、路由来电、留言、解决常见事项
- 24/7 与多语种服务，覆盖夜间与周末
- 跨部门工作流编排（规划/公共工程/财政/康乐），端到端处理请求
- 政府 CRM：记录每次交互与服务交付，提供领导层实时运营可视度
- 灾后恢复等应急场景的服务协调（如飓风 Helene 后 Polk County）
