name: Polimorphic (Poli)
name_en: Polimorphic
company: Polimorphic
domain: government
status: released
website: https://www.polimorphic.com
description: Polimorphic 是面向美国地方政府（city/county）的完整 AI 服务交付平台，核心 AI 助手名为 Poli。属于工作流应用型：面向政务场景编排
  AI（语音/短信/网页）+ CRM + 工作流编排，强调"政府专用、可控、合规"。Poli 比居民走完电话树更快地回答问题、路由来电、留言或解决常见问题，提供夜间/周末/多语种支持；工作流编排端到端处理请求并给领导层实时运营可视度。入选公共部门
  AI 中心首届 AI 50 榜单，最新融资由 General Catalyst 领投。
parameters: 未公开（编排通用模型 + RAG）
architecture: Government-specific AI assistant (voice/text/web) + CRM + workflow orchestration over general models
base_model: 前沿通用基座模型（未公开具体型号）
training:
  stages:
