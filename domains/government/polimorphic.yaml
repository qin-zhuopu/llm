    description: Polimorphic 面向政务场景编排通用模型并结合政府知识库/工作流，未公开自研垂类基础模型的训练细节
tech_stack:
  techniques:
  - Multi-channel AI (voice / text / web)
  - Retrieval over government knowledge and services
  - Workflow orchestration across departments
  - Government CRM (real-time demand and service records)
  - Multilingual support
benchmarks:
- name: Request turnaround (Tooele County, UT)
  score: 缩短约 50%
