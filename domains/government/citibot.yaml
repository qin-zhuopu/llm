description: Citibot 是"以居民为先、AI 驱动的政府沟通平台"，专为政府打造，整合 AI 驱动的语音、短信、网页自动化，帮助政府随时随地提供更快、更可及、更受信任的服务。属于工作流应用型：采用封闭系统
  AI（closed-system AI）保证合规、隐私与安全，避免开放式生成模型的幻觉，让居民在每个渠道都获得经核验、准确的信息。聚焦 311/居民服务/服务请求/通知等场景，在全美与多家城市、县级政府合作。
parameters: 未公开（封闭系统 AI，编排/约束式）
