  url: https://xbow.com/news/xbow-raises-120m-to-scale
- title: "XBOW: Pentest On-Demand for Security at Machine Speed"
  url: https://xbow.com/news/announcing-xbow-pentest-on-demand-for-security-at-machine-speed
