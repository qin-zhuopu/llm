name: Scale AI Donovan
name_en: Scale AI Donovan
company: Scale AI
domain: aerospace-defense
status: released
release_date: "2024"
website: https://scale.com/donovan
description: Scale AI开发的军事和国防领域AI Agent部署平台Donovan，支持在保密和断网环境中快速定制、评估和部署任务级AI智能体。基于无代码Agent Factory，集成多种前沿模型（如Defense Llama、Gemma、Llama 3.3等），为作战人员提供从概念到战场的快速AI能力部署，获得DISA IL4和FedRAMP High认证。
parameters: 未公开
architecture: decoder-only transformer
base_model:
- Llama 3.3 70B Instruct
- Scale Gemma 7B Instruct
- Llama 3.1 70B Instruct
- Defense Llama
training:
  stages:
  - name: fine-tuning
    description: Scale AI核心能力之一是模型微调，针对用户具体用例定制模型，或利用预训练的Defense Llama等国防专用模型
  - name: post-training
    description: 通过Agent Factory的无代码界面配置Agent指令、知识库和工具连接，实现任务级定制而无需重新训练
tech_stack:
  framework: Kubernetes containerized platform
  techniques:
  - No-code Agent Factory
  - Agentic RAG
  - Model comparison and evaluation
  - Data flywheel (持续改进)
  - Guardrails and Red-teaming
  - Multi-model support (模型无关)
  - Traceability and reasoning chains
  - GDELT data connectors
datasets:
- name: GDELT全球事件数据
  description: 全球实时事件监测数据，用于情报分析和威胁监控
  type: other
- name: DoD政策文档库
  description: 美国国防部政策文档知识库
  type: other
- name: 战区行动数据库
  description: 军事战区作战行动数据库
  type: other
benchmarks:
- name: 模型事实准确性
  score: 0.91
  metric: factual_accuracy
  comparison: "Llama 3.1 70B vs Scale Gemma 7B: 0.91 vs 0.81"
- name: 幻觉率
  score: 0.14
  metric: hallucination_rate
  comparison: "Llama 3.1 70B vs Scale Gemma 7B: 0.14 vs 0.24（越低越好）"
- name: 上下文召回率
  score: 0.79
  metric: context_recall
  comparison: "Llama 3.1 70B vs Scale Gemma 7B: 0.79 vs 0.71"
- name: P95延迟
  score: "2.1s"
  metric: latency_p95
  comparison: "Llama 3.1 70B vs Scale Gemma 7B: 2.1s vs 1.4s（精度与延迟权衡）"
api:
  available: true
  protocol: rest
  pricing: 联系销售（政府与国防合同定价）
  auth_method: 企业认证
capabilities:
- 无代码Agent Factory快速构建和定制任务级AI智能体
- 多模型对比评估确定最佳任务适配模型
- Agent Arsenal提供预优化的任务关键型AI智能体库
- 支持保密网络和断网（air-gapped）环境部署
- Agentic RAG实现多源数据的智能检索与分析
- 数据飞轮持续改进模型性能
- 完整推理链路的可追溯性
- Guardrails与红队测试确保AI安全
- DISA IL4和FedRAMP High安全认证
access:
- saas
- private-deployment
tags:
- defense
- military-ai
- agentic
- classified-networks
- fedramp
- intelligence-analysis
- model-evaluation
references:
- title: Scale AI Donovan Platform
  url: https://scale.com/donovan
- title: Scale AI Defense Solutions
  url: https://scale.com/government
