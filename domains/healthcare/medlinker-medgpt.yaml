description: 医联MedGPT是医联平台研发的医疗领域垂类大模型，致力于通过复刻权威专家的诊疗思路辅助医生决策。该模型依托800万余例问诊病例库、50000余份疾病指南/共识以及1200余条临床路径进行训练，覆盖临床医学26个二级学科、109个亚专科及30000余种疾病。其核心差异化在于坚持循证医学与真人医生严格复核的闭环机制，能够为常见病和部分专科病提供高效、合理的诊断建议及检查用药方案。
capabilities:
- 多科室智能分诊与问诊
- 疾病辅助诊断与决策支持
- 循证医学指南与共识检索
- 合理用药检查与处方审核
- 临床路径规范化建议
- 真人医生审核与质控
