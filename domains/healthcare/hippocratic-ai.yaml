name: Hippocratic AI
company: Hippocratic AI
domain: healthcare
status: released
release_date: "2023"
website: https://www.hippocratic.ai
description: >-
  Hippocratic AI是一款安全性优先的医疗大语言模型，基于Polaris星座架构(constellation architecture)构建，
  总参数规模达1万亿(one-trillion)，由多个数十亿参数级LLM组成协作智能体系统。该系统由一个有状态主智能体和多个专业支持智能体组成，
  专注于非诊断性临床任务。经1100+美国注册护士和130+医师评估，系统在医疗安全、临床准备度、对话质量和床旁态度方面表现与人类护士相当，
  融资总额超4亿美元，估值35亿美元。
parameters: "1T (constellation of multi-billion parameter LLMs)"
architecture: LLM constellation (multi-agent cooperative architecture)
training:
  stages:
    - name: pre-training
      description: 基座模型在大规模通用语料上预训练
    - name: continual-pre-training
      description: 使用专有医疗数据、临床护理计划、医疗监管文件和医学手册进行持续预训练
    - name: sft
      description: 使用真实医患对话和模拟对话(患者演员与资深护士)进行监督微调，对齐医疗专业人员说话风格
    - name: rlhf
      description: 迭代式协同训练(iterative co-training)多个智能体，针对多种目标(安全性、共情、准确性)优化
  context_length: "32K"
datasets:
  - name: 医疗专有训练数据
    description: 专有医疗数据、临床护理计划和医学推理文档
    type: pre-training
  - name: 医疗监管文件
    description: 医疗健康监管文件和医学手册
    type: pre-training
  - name: 有机医患对话数据
    description: 真实的医患对话及患者演员与资深护士的模拟对话
    type: sft
tech_stack:
  techniques:
    - Multi-agent constellation architecture
    - Iterative co-training protocol
    - Stateful primary agent with specialist support agents
    - Custom ASR for clinical dialogue (NVIDIA合作)
    - Safety-focused alignment
    - Rapport and empathy optimization
benchmarks:
  - name: 医疗安全评估(护士评估)
    score: "与人类护士持平"
    metric: clinician evaluation
    comparison: "1100+注册护士端到端对话评估"
    source: self-reported
  - name: LawBench医疗安全维度
    score: "显著优于GPT-4"
    metric: task-based evaluation
    comparison: "vs GPT-4和LLaMA-2 70B，专业支持智能体显著胜出"
    source: self-reported
  - name: 临床准备度
    score: "与人类护士持平"
    metric: clinician evaluation
    comparison: "130+美国执业医师评估"
    source: self-reported
  - name: 对话质量与床旁态度
    score: "与人类护士持平"
    metric: conversational quality
    comparison: "综合维度人类评估"
    source: self-reported
capabilities:
  - 患者导航与就医流程指导
  - 个性化用药提醒与药物咨询
  - 出院后健康状况智能随访
  - 慢性病日常管理与康复指导
  - 术前准备流程说明与患者教育
  - 临床医患对话语音识别(NVIDIA合作定制ASR)
  - 多轮长对话中的共情和信任建立
tags:
  - 医疗大模型
  - 多智能体
  - 患者管理
  - 语音识别
  - 安全优先
  - 非诊断任务
  - constellation
access:
  - api
  - saas
api:
  available: true
  protocol: proprietary
  pricing: AI智能体人力市场模式，按需雇佣
business:
  funding_total: $444M
  latest_round: Series C ($126M, 2025-11)
  valuation: $3.5B
  customers: 250M+ 患者交互；300+ 临床用例上线；50+ EMR 集成(含 Epic)；服务前20大药企中的7家
  investors:
    - Kleiner Perkins
    - Avenir Growth
    - Premji Invest
    - General Catalyst
    - Andreessen Horowitz (a16z)
    - NVIDIA NVentures
references:
  - title: Hippocratic AI 官方网站
    url: https://www.hippocraticai.com/
  - title: "Polaris: A Safety-focused LLM Constellation Architecture for Healthcare"
    url: https://arxiv.org/abs/2403.13313
