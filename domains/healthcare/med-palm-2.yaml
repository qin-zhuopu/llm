name: Med-PaLM 2
company: Google DeepMind
domain: healthcare
status: released
description: Med-PaLM 2 是由 Google DeepMind 开发的医疗专用大语言模型，旨在通过先进的生成式 AI 技术，解锁医疗信息的潜力，为健康科学研究生成新颖见解，并开发个性化的健康解决方案。该模型致力于辅助用户获取高质量的医学信息，确保信息的可及性和文化相关性，同时帮助医疗组织优化工作流程，减轻行政负担并降低成本。
capabilities:
- 提供高质量的医疗与健康信息检索
- 生成医学科学见解与健康研究报告
- 辅助医疗组织优化工作流程与管理
- 开发个性化的健康解决方案与建议
- 支持多语言医疗咨询与科普服务
