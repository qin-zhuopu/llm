name: 左手医生GPT
name_en: Zuoshou Doctor GPT
company: 左手医生（北京左手医生智能科技有限公司）
domain: healthcare
status: released
release_date: "2023"
website: https://www.zuoshouyisheng.com
description: 基于大语言模型和医学知识图谱构建的医疗AI助手，覆盖数千种疾病和数万种药品信息，通过海量医患对话数据持续优化。核心NLP引擎针对中文医疗语境深度优化，能理解患者口语化描述并转化为结构化医学信息。已服务数百万用户，广泛应用于互联网医院、基层卫生服务中心和健康管理平台，为基层医生提供临床辅助决策支持。
parameters: 未公开
architecture: decoder-only transformer + Knowledge Graph
training:
  stages:
  - name: pre-training
    description: 基于大规模医学文献、临床指南、药品说明书等专业语料进行预训练，构建医学知识理解基础
  - name: continual-pre-training
    description: 使用海量中文医患对话数据进行继续预训练，增强口语化医疗描述理解和中文医学NLP能力
  - name: sft
    description: 针对预问诊、分诊导诊、健康咨询、临床决策支持等核心场景进行监督微调
  - name: other
    description: 医学知识图谱对齐训练，将覆盖数千种疾病、数万种药品的结构化知识与语言模型深度融合
tech_stack:
  framework: PyTorch (推测)
  inference: Cloud-based SaaS
  techniques:
  - Medical NLP engine (中文医疗语境优化)
  - Medical Knowledge Graph (数千疾病+数万药品)
  - Symptom-to-diagnosis mapping
  - Drug interaction detection
  - Evidence-based medicine retrieval
  - Safety boundary constraints
datasets:
- name: 医患对话数据集
  description: 海量真实医患对话数据，覆盖多科室多病种的问诊交互
  type: sft
- name: 医学知识库
  description: 涵盖数千种疾病、数万种药品、临床指南和专家共识的结构化知识
  size: "数千种疾病 + 数万种药品"
  type: pre-training
- name: 循证医学文献
  description: 医学文献、临床指南、药品说明书等专业资料
  type: pre-training
benchmarks:
- name: 用户服务规模
  score: "数百万"
  metric: user_count
  comparison: "累计服务数百万用户，覆盖互联网医院和基层医疗机构"
- name: 疾病覆盖
  score: "数千种"
  metric: disease_coverage
  comparison: "知识图谱覆盖数千种疾病的诊断路径"
- name: 药品信息
  score: "数万种"
  metric: drug_coverage
  comparison: "整合数万种药品信息，支持药物相互作用查询"
- name: 应用场景覆盖
  score: "4+"
  metric: scenario_count
  comparison: "覆盖互联网医院、基层卫生中心、健康管理平台、医药电商"
capabilities:
- 智能预问诊（口语化描述转结构化医学信息）
- 多症状联合分析与智能分诊导诊
- 临床辅助决策（诊断建议、用药方案推荐）
- 循证医学知识问答（疾病科普、药物查询、检验解读）
- 药物相互作用检测与用药安全提示
- 全天候健康咨询服务
tags:
- 医疗大模型
- 临床决策支持
- 智能分诊
- 健康咨询
- 知识图谱
- nlp
access:
- saas
references:
- title: 左手医生官方网站
  url: https://www.zuoshouyisheng.com
