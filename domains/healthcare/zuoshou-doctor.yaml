description: 左手医生GPT是基于大语言模型技术构建的医疗AI助手，专注于为基层医疗机构和普通用户提供智能化的医疗健康服务。该模型利用医学NLP引擎和覆盖数千种疾病、数万种药品的知识图谱，通过海量医患对话数据持续优化，致力于通过AI技术降低优质医疗资源的获取门槛，已服务数百万用户。
capabilities:
- 智能预问诊：理解患者口语化描述并转化为结构化医学信息
- 智能分诊导诊：基于多症状联合分析推荐就诊科室和医生
- 临床辅助决策：为基层医生提供诊断和用药方案建议
- 医学知识问答：整合医学文献与指南提供专业健康咨询
