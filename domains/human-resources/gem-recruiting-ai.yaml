name: Gem
name_en: Gem
company: Gem
domain: human-resources
status: released
website: https://www.gem.com
description: Gem 是一个 AI-first 的一体化招聘平台，被 1,200+ 人才获取团队使用，把 sourcing、review、hire 与 report
  整合在一处。核心是三个 AI 智能体——AI Sourcing Agent（搜索 800M+ 档案并用已验证联系方式触达）、AI App Review Agent（以
  5x 速度对投递者排序并解释匹配理由）、AI Fraud Detection Agent（识别欺诈候选人）——并将 ATS、CRM、Scheduling、Analytics
  内嵌 AI，可接入现有 ATS 或端到端替换 5+ 工具、技术成本降低最高 50%。
parameters: 未公开
architecture: 工作流应用型（招聘工作流编排 + 自研评分/欺诈检测模型）
training:
  stages:
  - name: fine-tuning
    description: 在 800M+ 候选人档案与投递者评估数据上训练 sourcing、排序与欺诈检测模型
  - name: rlhf
    description: 基于招聘结果与招聘官反馈优化候选人排序与匹配解释
tech_stack:
  framework: 自研 AI 平台
  inference: Cloud SaaS + ATS 集成
  techniques:
  - AI sourcing over 800M+ profiles
  - Applicant ranking with rationale
  - Fraud/duplicate candidate detection
  - CRM nurture automation
  - Interview scheduling automation
