name: Moonhub
name_en: Moonhub
company: Moonhub
domain: human-resources
status: released
website: https://moonhub.ai
description: Moonhub 是一家「AI + 专家」的招聘公司，用专有 AI 智能体帮助企业更快招到顶尖人才。核心是 Qualify AI（跨数百万档案识别最合格候选人）、Engage
  AI（规模化个性化触达并转化冷线索）与 Monitor AI（实时分析意向并执行交接升级）三个智能体，7×24 小时识别、打分、触达并互动候选人，利用数十亿公开候选人数据点与专有洞察，客户面试其推荐候选人比例达
  80%，招聘周期平均缩短 50%。
parameters: 未公开
architecture: 模型系统型（自研候选人评分/匹配模型 + 多智能体编排）
training:
  stages:
  - name: fine-tuning
    description: 在数十亿公开候选人数据点与专有候选人洞察上训练资格评估与匹配模型
  - name: rlhf
    description: 基于客户面试转化率与招聘结果反馈优化候选人打分与触达策略
tech_stack:
  framework: 自研 AI 平台
  inference: Cloud SaaS
  techniques:
  - Candidate qualification scoring
  - Personalized outreach at scale
  - Real-time intent monitoring
  - Multi-agent orchestration
  - Global employment / payroll & compliance
