name: KPMG Clara & AI Solutions
name_en: KPMG Clara & AI Solutions
company: KPMG
domain: accounting-audit
status: released
release_date: "2023"
website: https://kpmg.com/us/en/ai.html
description: KPMG 基于生成式 AI 技术构建的企业级审计与会计智能解决方案套件，核心产品包括 KPMG Clara 智能审计平台、KPMG Ignite AI 平台和 KPMG Blaze 技术现代化工具。通过与 OpenAI 战略联盟（Elite Partner）整合大语言模型能力，为审计、税务、咨询等专业领域提供 AI 驱动的决策支持、风险识别和效率提升，已获得 HFS Research、IDC MarketScape 等多个行业权威机构认可为 AI 服务市场领导者。
parameters: 未公开
architecture: decoder-only transformer
base_model: GPT-4
training:
  stages:
  - name: fine-tuning
    description: 基于 KPMG 175年专业知识积累和审计方法论进行领域微调，整合 Trusted AI 原则确保输出可信赖和可解释
  - name: rlhf
    description: 由审计和税务专业人员进行人工反馈强化学习，确保 AI 输出符合专业标准和监管要求
tech_stack:
  framework: OpenAI GPT + KPMG Ignite Platform
  inference: Azure OpenAI Service
  techniques:
  - Retrieval-Augmented Generation (RAG)
  - Trusted AI guardrails
  - Domain-specific prompt engineering
  - Enterprise data integration
  - Human-in-the-loop validation
  - Agentic AI orchestration
