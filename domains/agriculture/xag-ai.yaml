description: 极飞科技 (XAG) 是一家领先的农业科技公司，致力于研发农业无人机、智慧农业IoT产品和农业机器人。其产品线包括P系列农业无人机（如P150、P60）、R系列农业无人车（R100、R200）以及智能农场物联网设备（FBV、FPI等）。极飞科技整合了无人机遥感与AI技术，提供精准农业解决方案。
