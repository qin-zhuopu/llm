description: 丰农AI是丰农控股旗下的智慧农业人工智能平台，致力于将先进的AI技术应用于农业生产全流程，覆盖水稻、小麦、玉米等多种农作物。该平台采用计算机视觉、深度学习及大数据分析技术，实现病虫害智能诊断与精准种植推荐，并支持离线使用与方言交互，推动中国农业数字化与智能化转型。
capabilities:
