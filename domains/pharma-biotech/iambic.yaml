name: Iambic Therapeutics
name_en: Iambic Therapeutics
company: Iambic Therapeutics
domain: pharma-biotech
status: released
release_date: '2021'
website: https://www.iambic.ai/
description: Iambic Therapeutics 是 AI 分子超级智能平台，集成 Enchant（多模态 transformer，可从小型噪声数据集学习并预测大量生化和细胞活性）
  和 NeuralPLexer（提供近乎即时的蛋白-配体结构预测，覆盖广泛蛋白类别）两大核心 AI 技术，配合高通量纳米级合成实验平台每周完成数千种新分子设计到生物学数据的完整闭环。
  管线包括 IAM1363（HER2 脑穿透抑制剂，Phase 1/1b，EGFR选择性>1000倍）、IAM217（KIF18A 卵巢癌/TNBC 脑穿透）、IAM-C1（CDK2/4
  乳腺癌）， 从项目启动到Phase 1仅约2年，vs行业平均约6年。
parameters: 未公开
architecture: multimodal transformer + co-folding neural network
training:
  stages:
  - name: pre-training
    description: Enchant 多模态 transformer 基于大规模生化活性数据和分子表征数据预训练
  - name: fine-tuning
    description: 针对特定靶点（HER2/KIF18A/CDK2等）使用高通量实验产生的活性数据微调
  - name: other
    description: 每周闭环迭代 - 自动化数据管线将新实验数据反馈并重新训练模型，实现持续学习
datasets:
- name: 生化活性数据集
  description: 覆盖广泛靶点类别的生化和细胞活性测定数据，用于 Enchant 预训练
  type: pre-training
- name: 蛋白-配体结构数据
  description: 蛋白质晶体结构和配体结合构象数据，用于 NeuralPLexer 训练
  type: pre-training
- name: 高通量实验反馈数据
  description: 每周数千种新分子的纳米级合成、生化/代谢/细胞活性测定数据
  size: 数千种新分子/周
  type: other
tech_stack:
  framework: PyTorch
  techniques:
  - multimodal transformer (Enchant)
  - protein-ligand co-folding (NeuralPLexer)
  - generative molecular design
  - high-throughput nanoscale synthesis
  - automated DMTA cycle
  - de novo structure prediction
  - cryptic pocket prediction
benchmarks:
- name: 项目到Phase 1时间
  score: ~2年
  metric: time-to-clinic
  comparison: IAM1363从项目启动到Phase 1约2年 vs 行业平均约6年
  source: self-reported
- name: HER2选择性
  score: '>1000x'
  metric: selectivity vs EGFR
  comparison: IAM1363 vs 现有HER2 TKI选择性显著提升，避免EGFR毒性
  source: self-reported
- name: 每周分子设计通量
  score: 数千种/周
  metric: compounds synthesized per week
  comparison: vs 传统药化团队每周数十种
  source: self-reported
capabilities:
- Enchant 多模态 transformer 从小噪声数据集预测广泛生化活性
- NeuralPLexer 近乎即时预测蛋白-配体共折叠结构和隐性口袋
- 高通量纳米级合成平台每周产出数千种新化合物
- AI 驱动 hit-to-lead 优化将数月缩至数周
- 脑穿透小分子设计能力（IAM1363/IAM217均具脑穿透性）
- 多靶点多机制临床管线（正构抑制剂/变构抑制剂/PPI调节剂）
- 每周自动化数据管线和模型重训练实现持续学习
tags:
