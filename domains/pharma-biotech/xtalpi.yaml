name: XtalPi Science
name_en: XtalPi Science
company: 晶泰科技
domain: pharma-biotech
status: released
release_date: '2024'
website: https://www.xtalpi.com/en
description: 晶泰科技开发的AI驱动科学发现平台XtalPi Science，通过多智能体（Multi-Agent）架构编排科学AI和物理AI，连接人类科学家与200+垂直领域AI模型以及24/7运行的自主实验室机器人，实现干湿实验的自主闭环迭代，加速分子研发过程的民主化。平台包含Genius
  Agents智能枢纽、领域AI模型和Physical AI实体实验室机器人三层架构。
parameters: 未公开
architecture: decoder-only transformer
training:
  stages:
  - name: pre-training
    description: 基于晶泰科技自有的化合物数据和反应数据训练200+垂直领域AI模型，覆盖分子发现的智能实验设计、预测和分析
  - name: fine-tuning
    description: 针对XFEP自由能计算、XMolGen生成化学、SureRoute逆合成、XtalGazer晶型预测等具体任务进行专业微调
  - name: post-training
    description: Genius Agents后训练，使其能够理解科学意图并编排领域AI模型与物理AI实验室机器人，驱动自主干湿实验迭代
tech_stack:
  framework: PyTorch
  techniques:
  - Multi-Agent orchestration
  - Agentic AI (Genius Agents)
  - Physical AI (Embodied Lab Robots)
  - Free Energy Perturbation (XFEP)
  - Generative Chemistry (XMolGen)
  - Retrosynthesis (SureRoute)
  - Crystal Structure Prediction (XtalGazer CSP)
  - Dry-wet experimental loop
  - 24/7 autonomous lab execution
datasets:
- name: XtalPi化合物数据库
  description: 晶泰科技自有的大规模化合物结构、反应和晶型数据，训练200+垂直领域AI模型
  type: pre-training
- name: 自主实验室反馈数据
  description: Physical AI实验室机器人24/7运行产生的实验数据，持续反哺模型训练
  type: sft
benchmarks:
- name: 垂直领域AI模型数量
  score: 200+
  metric: model_count
  comparison: 覆盖分子发现全流程的智能实验设计、预测和分析
  source: self-reported
- name: SureRoute逆合成准确性
  score: Hallucination-free
  metric: hallucination_rate
  comparison: 'vs 传统逆合成工具: 实现无幻觉的自改进逆合成平台'
  source: self-reported
- name: 药物发现效率
  score: 28天发现新颖高活性命中化合物
  metric: time_to_hit
  comparison: GPX4靶点28天内发现非共价高活性命中物
  source: self-reported
