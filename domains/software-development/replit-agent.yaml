capabilities:
- 用自然语言 one-shot prompt 端到端构建并部署完整应用
- 在完整构建前自动梳理与澄清需求，把粗略概念变为可用原型
- 多用户"氛围编程"协作（kanban 任务与角色定义）
- 浏览器内云 IDE + 托管部署一体化
- 与 Microsoft Azure 集成，上架 Azure Marketplace 面向企业
