name: Replit Agent
name_en: Replit Agent
company: Replit
domain: software-development
status: released
release_date: 2024-09
website: https://replit.com/agent
description: Replit Agent 是 Replit 于 2024 年 9 月发布的 AI 编程 Agent，用户用自然语言即可自动化软件开发、端到端构建并部署完整应用。属于工作流应用型：在前沿基座模型之上构建
  Agent + 浏览器内云 IDE + 托管部署的一体化产品。Agent 4 接受一次性 prompt，先梳理需求再完整构建，支持通过 kanban 的多用户"氛围编程"协作。护城河来自"从描述到上线"的端到端闭环体验而非自研基础模型。据媒体报道
  ARR 突破 $100M、估值达 $60B。
parameters: 未公开（编排前沿基座模型）
architecture: Agentic workflow application over frontier base models + cloud IDE + hosting
base_model: 前沿通用基座模型（未公开具体型号）
training:
  stages:
  - name: other
    description: Replit Agent 主要编排前沿通用模型并结合浏览器 IDE、云执行与托管部署，未公开自研垂类基础模型的训练细节
tech_stack:
