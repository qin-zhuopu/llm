description: 地平线 (Horizon Robotics, HKEX:9660) 面向乘用车智能驾驶的全栈解决方案，核心为 Horizon SuperDrive
  (HSD) 城区+高速一体的端到端智能辅助驾驶系统，运行在自研 Journey（征程）系列车规级计算 SoC 上。地平线首创并持续实践软硬件一体
  (software-hardware integration) 的智驾路线，兼顾系统性能与量产效率，推动智能驾驶在乘用车上的大规模落地。
parameters: 未公开
