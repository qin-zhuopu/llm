name: Cerence CaLLM
name_en: Cerence CaLLM
company: Cerence AI
domain: automotive
status: released
release_date: '2024'
website: https://www.cerence.com
description: Cerence CaLLM 是 Cerence AI 开发的先进车载大语言模型系列，专为汽车和移动出行领域设计。核心产品 xUI 已与吉利等主机厂合作部署，支持上下文感知的多轮自然对话、Say
  What You See屏幕元素语音操控和多座位分区识别。技术已搭载于5.25亿+辆汽车中，服务80+主机厂和Tier-1客户，拥有625项专利和25年以上创新积累。配套
  Dealer Assist Agent (DAA) 为经销商提供24/7 AI客户服务和预约管理。
parameters: 未公开
architecture: decoder-only transformer
training:
  stages:
  - name: pre-training
    description: 基于大规模语言数据和汽车领域知识进行预训练，构建车载场景语言理解基础
  - name: fine-tuning
    description: 针对车载交互场景（导航、媒体、车控、服务预约）进行专项微调，优化多轮对话和意图理解
  - name: other
    description: 使用车载声学环境数据训练语音增强模型，包括引擎噪声、路面振动、风声雨声和多乘客交谈等复杂噪声条件
tech_stack:
  framework: Cerence proprietary platform
  inference: Edge deployment (on-vehicle) + Cloud hybrid
  techniques:
  - CaLLM (Car Large Language Model)
  - xUI contextual dialogue engine
  - Say What You See (Voice-to-Element Matching)
  - Dynamic speech enhancement (multi-seat)
  - Emergency Vehicle Detection (EVD) Audio AI
  - Zero Trust security architecture
  - Multi-modal interaction (voice + touch + visual)
  - Microsoft partnership (Mobile Work Agent)
datasets:
- name: Automotive Voice Interaction Data
  description: 车载语音交互数据，覆盖多种驾驶环境和噪声条件
  type: sft
- name: Emergency Siren Database
  description: 全球近50个国家1500+种紧急车辆警笛音频数据
  size: 1500+ siren types, ~50 countries
  type: sft
- name: OEM Integration Data
  description: 80+主机厂车辆信号、VIN信息和品牌定制数据
  type: sft
benchmarks:
- name: Vehicles Shipped
  score: 525M+
  metric: deployment_scale
  comparison: 5.25亿+辆汽车搭载 Cerence AI 技术，全球车载AI部署规模最大
  source: self-reported
- name: OEM Customers
  score: 80+
  metric: customer_count
  comparison: 服务全球80+主机厂和Tier-1供应商
  source: self-reported
- name: Emergency Vehicle Detection Range (Interior)
  score: 300m+
  metric: detection_distance
  comparison: 车内麦克风可从300米外检测到紧急车辆警笛
  source: self-reported
- name: Emergency Vehicle Detection Range (Exterior)
  score: 800m+
  metric: detection_distance
  comparison: 配合外部麦克风检测距离超过800米
  source: self-reported
- name: Revenue Growth
  score: 12% YoY
  metric: revenue_growth
  comparison: Q3 2026营收同比增长12%，联网服务收入同比增长20%
  source: self-reported
capabilities:
- 上下文感知的多轮自然对话（无唤醒词打断、跨轮次记忆）
- Say What You See 屏幕元素语音操控，实时读取UI界面转为语音快捷方式
- 多座位分区语音识别，支持多乘客同时交互
- 紧急车辆检测（EVD），从300-800米外识别警笛并预警
- 车载信号深度集成（VIN、燃油/电量、车窗状态等实时数据读取和操控）
- 高噪声驾驶环境下的动态语音增强
- Dealer Assist Agent (DAA) 24/7经销商客户服务
- 零信任安全架构防御对抗性攻击
access:
- private-deployment
- api
