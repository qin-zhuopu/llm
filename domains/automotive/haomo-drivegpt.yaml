description: DriveGPT（雪湖·海若）是毫末智行发布的自动驾驶生成式大模型，采用自回归Transformer架构，将驾驶行为建模为序列化决策过程。该模型借鉴大语言模型技术，提出“Drive
  Language”驾驶语言概念，通过海量真实道路数据训练，具备可扩展性设计（Scaling Law），为城市及高速导航辅助驾驶（NOH）提供核心AI引擎支撑。
architecture: decoder-only transformer (autoregressive)
capabilities:
- 行为规划与预测：预测交通参与者状态，规划自车轨迹
- 场景理解：通过多模态输入理解复杂交通场景元素和关系
- 决策推理：对驾驶决策进行逻辑推理并解释特定选择
- 多智能体交互建模：建模多车交互关系并预测交通流演化
