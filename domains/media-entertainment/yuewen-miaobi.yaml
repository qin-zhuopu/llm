name: 阅文妙笔
name_en: Yuewen MiaoBi
company: 阅文集团
domain: media-entertainment
status: released
release_date: 2023-07
website: https://www.yuewen.com
description: 阅文妙笔是阅文集团推出的AIGC文学创作大模型，专注于网络文学辅助创作。依托阅文平台超千万创作者、200多种内容品类的海量优质IP资源以及漫剧助手等多模态AI创作平台，妙笔模型在故事生成、角色塑造、情节推进和文风模拟等方面具有独特优势，支撑阅文IP全产业链（文学、动漫、影视、游戏、周边）的智能化内容生产。
parameters: 未公开
architecture: decoder-only transformer
training:
  stages:
  - name: pre-training
    description: 基于海量中文通用语料和文学作品进行预训练，构建强大的中文语言生成能力
  - name: continual-pre-training
    description: 使用阅文平台海量网络文学作品（覆盖200多种品类）进行持续预训练，深入学习各流派写作风格
  - name: sft
    description: 基于专业作家标注的高质量创作数据进行监督微调，包括情节构建、角色对话、文风控制等任务
  - name: rlhf
    description: 由签约白金作家和资深编辑进行人类反馈强化学习，优化创作质量和连贯性
tech_stack:
  techniques:
  - Long-context modeling
  - Character consistency tracking
  - Plot structure planning
  - Style transfer
  - Multi-modal content generation (漫剧助手)
datasets:
- name: 阅文网络文学语料库
  description: 阅文平台千万级创作者产出的海量网络文学作品，覆盖玄幻、都市、历史等200多种品类
  type: pre-training
- name: IP改编数据
  description: 来自阅文IP全链开发的影视剧本、动画脚本、游戏对话等跨媒介改编数据
  type: sft
- name: 作家创作过程数据
  description: 签约作家的创作过程数据，包含大纲设计、章节规划、修改痕迹等
  type: sft
benchmarks:
- name: 中文故事生成质量
  score: 行业领先
  metric: expert_evaluation
  comparison: 'vs 通用大模型: 在网文风格一致性、情节连贯性上显著优于GPT-4等通用模型'
  source: self-reported
- name: 角色对话一致性
  score: 高一致性
  metric: character_consistency
  comparison: 角色人设保持能力优于通用对话模型
  source: self-reported
capabilities:
- 多流派网络文学长篇故事生成（玄幻、言情、悬疑等200+品类）
- 角色人设创建与对话生成，保持人物性格一致性
- 情节大纲规划与章节自动续写
- 多种文风模拟与风格迁移
- 漫剧等多模态内容的AI辅助创作
- IP改编辅助（小说到剧本/动画脚本转换）
- 创作者智能助手，提供写作建议和灵感激发
access:
- saas
tags:
- creative-writing
- web-novel
- aigc
- ip-development
- chinese-literature
- multi-modal
references:
- title: 阅文集团官网
  url: https://www.yuewen.com
- title: 阅文妙笔AI创作平台
  url: https://www.yuewen.com
