name: "Tinker"
name_en: "Tinker (Thinking Machines Lab)"
company: "Thinking Machines Lab"
founded: "2025-02"
website: "https://thinkingmachines.ai/tinker/"
status: beta
description: "Thinking Machines Lab推出的AI推理与训练平台，由前OpenAI CTO Mira Murati创立。平台提供28+模型的LoRA微调服务（支持SFT/RL/DPO/蒸馏），以及自研Inkling系列模型的Serverless推理API。融资$2B，估值$12B。"

funding:
  total_raised: "$2B"
  latest_round: "seed"
  valuation: "$12B"
  lead_investors:
    - "a16z"

team:
  size: "~212人"
  key_people:
    - name: "Mira Murati"
      role: "创始人/CEO"
      background: "前OpenAI CTO"

inference_api:
  available: true
  status: beta
  models:
    - name: "Inkling"
      model_id: "thinkingmachines/Inkling"
      parameters: "975B MoE"
      context_length: "256K"
      modalities:
        - text
        - vision
        - audio
      pricing:
        input_per_million: "$1.00"
        output_per_million: "$4.05"
        unit: "per million tokens"
    - name: "Inkling-Small"
      model_id: "thinkingmachines/Inkling-Small"
      parameters: "276B MoE"
      context_length: "256K"
      modalities:
        - text
      pricing:
        input_per_million: "$0.30"
        output_per_million: "$1.20"
        unit: "per million tokens"

