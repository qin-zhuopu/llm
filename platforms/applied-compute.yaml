name: "Applied Compute Agent Cloud (AC2)"
name_en: "Applied Compute Agent Cloud (AC2)"
company: "Applied Compute"
founded: "2025-10"
website: "https://www.appliedcompute.com"
status: beta
description: "Applied Compute推出的企业级AI训练与推理平台，专注于Specific Intelligence（特定智能）。平台由前OpenAI研究员（参与o1/Codex项目）创立，提供全参数RL后训练、LoRA微调、自蒸馏等训练能力，以及专属推理部署。客户拥有模型和数据，采用嵌入式工程团队模式。融资$160M，估值$1.3B，客户包括Harvey、DoorDash、Cognition、Mercor、NVIDIA等。"

funding:
  total_raised: "$160M"
  latest_round: "Series B"
  valuation: "$1.3B"
  lead_investors:
    - "Kleiner Perkins"
    - "Benchmark"
    - "Sequoia"
    - "Lux"

team:
  key_people:
