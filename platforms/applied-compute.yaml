    - rl
    - lora
    - distillation
  features:
    - "全参数强化学习后训练"
    - "LoRA微调"
    - "On-policy自蒸馏"
    - "嵌入式工程团队支持"
    - "Ari AI研究助手（自动监控、分析、报告）"
    - "自带训练Harness支持"
    - "生产流量回流训练"
    - "SOC 2 / ISO 42001认证"

